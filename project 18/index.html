<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Applicaion Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <form action="">
            <label for="name">User's Full Name</label>
            <input type="text" id="name"><br>
            <label for="email">User's Email Address</label>
            <input type="email" id="email"><br>
            <label for="position">Job Position</label>
<select id="position" name="position">
    <option value="">Select a position</option>
    <option value="manager">Manager</option>
    <option value="managing-director">Managing Director</option>
    <option value="frontend-developer">Frontend Developer</option>
    <option value="mern-full-stack">MERN Full Stack</option>
</select>

<fieldset class="radio-group">
    <legend>Availability</legend>

    <input type="radio" id="available" name="availability" value="available" checked>
    <label for="available">Available</label>

    <input type="radio" id="unavailable" name="availability" value="unavailable">
    <label for="unavailable">Unavailable</label>
</fieldset>

<label for="message">Message</label>
<textarea id="message"></textarea>

<button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
